name: Build Chicken Clicker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          ZIP="Chicken_Clicker_Cases_Atlas.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repository root"
            ls -la
            exit 1
          fi

          mkdir -p project
          unzip -oq "$ZIP" -d project

          echo "Files extracted from ZIP:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Android Gradle project
        id: project
        run: |
          SETTINGS=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found in the ZIP"
            echo "Checking available Gradle files:"
            find project -type f \
              \( -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chicken-Clicker-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
